<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15120e" />

    <title>Barbería Central — Cortes clásicos y modernos en Córdoba</title>
    <meta name="description" content="Barbería Central: cortes clásicos y modernos, afeitado a navaja y diseño de barba en Córdoba. Reservá tu turno por WhatsApp." />
    <link rel="canonical" href="https://tudominio.com/" />

    <!-- Open Graph: cómo se ve el link al compartirlo en WhatsApp, Instagram, Facebook -->
    <meta property="og:type" content="business.business" />
    <meta property="og:title" content="Barbería Central — Cortes clásicos y modernos en Córdoba" />
    <meta property="og:description" content="Reservá tu turno por WhatsApp. Cortes, afeitado a navaja y diseño de barba." />
    <meta property="og:image" content="https://tudominio.com/hero.jpg" />
    <meta property="og:locale" content="es_AR" />

    <!-- Datos estructurados para Google (SEO local). Editá los valores según el negocio real. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",
      "name": "Barbería Central",
      "image": "https://tudominio.com/hero.jpg",
      "telephone": "+54 9 351 000-0000",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Av. Colón 1234",
        "addressLocality": "Córdoba",
        "addressCountry": "AR"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "20:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "14:00" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
